[package]
name = "mivon-gui"
version = "0.3.0"
edition = "2021"
description = "Mivon GUI — RTL Engineering Control Center (ratatui TUI, dipanggil via `mivon gui`)"

[dependencies]
mivon-core = { path = "../mivon-core" }
mivon-ast = { path = "../mivon-ast" }
mivon-ir = { path = "../mivon-ir" }
mivon-parser = { path = "../mivon-parser" }
mivon-elaboration = { path = "../mivon-elaboration" }
mivon-compiler = { path = "../mivon-compiler" }
mivon-simulator = { path = "../mivon-simulator" }
mivon-mv = { path = "../mivon-mv" }

# TUI: ratatui + crossterm (terminal, tanpa GUI grafis / tanpa GPU)
ratatui = { version = "0.26", default-features = false, features = ["crossterm"] }
crossterm = "0.28"

# Rayon: pool global dengan stack BESAR untuk worker parse — sama seperti CLI
rayon = "1"
# LSP client: GUI spawn server `mivon --lsp` (mivon-env::lsp, tower-lsp) sebagai
# subprocess; tipe pesan JSON-RPC dari lsp-types (versi sama dengan mivon-env).
lsp-types = "0.94"
# Serialisasi workspace state + coverage
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
