[package]
name = "mivon-node-cache"
version = "0.3.0"
edition = "2021"
description = "node_cache — filesystem-native, content-addressed computation cache (pengganti MICD)"
license = "MIT"

[dependencies]
# Identitas: BLAKE3 untuk content ID dan node ID (node_cache.md).
blake3 = "1"
# Hash 64-bit isi file untuk deteksi perubahan (algoritma sama dengan mivon-core).
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Metadata node biner (manifest/graph/ref/journal) — schema eksplisit di format/.
bincode = "1.3"
serde = { version = "1", features = ["derive"] }
mivon-core = { path = "../mivon-core" }
mivon-ast = { path = "../mivon-ast" }
mivon-ir = { path = "../mivon-ir" }
