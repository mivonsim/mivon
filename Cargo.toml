[workspace]
# src-tauri dipindah ke legacy/ (digantikan GUI egui di src/gui/)
# Migrasi monorepo: logika dipindah bertahap dari src/ ke crates/.
resolver = "2"
members = [
    "crates/mivon-diag",
    "crates/mivon-core",
    "crates/mivon-ast",
    "crates/mivon-ir",
    "crates/mivon-parser",
    "crates/mivon-elaboration",
    "crates/mivon-compiler",
    "crates/mivon-simulator",
    "crates/mivon-mv",
    "crates/mivon-formal",
    "crates/mivon-sir",
    "crates/mivon-netlist",
    "crates/mivon-timing",
    "crates/mivon-tech",
    "crates/mivon-synth",
    "crates/mivon-env",
    "crates/mivon-emu",
    "crates/mivon-tools",
    "crates/mivon-gui",
    "crates/mivon-api",
    "crates/mivon-fuzz",
    "crates/mivon-tests",
]

[package]
name = "mivon"
version = "0.3.0"
edition = "2021"
description = "RTL Simulator untuk SystemVerilog - dibangun dengan Rust"
default-run = "mivon"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rayon = "1"
# malloc_trim(0) — lepaskan heap free pages (AST parse) kembali ke OS agar
# baseline RSS turun sebelum elaborasi/simulasi (mesin kecil, anti-OOM).
libc = "0.2"
# MICD: binary serialization AST per file (persistent incremental compile)
bincode = "1.3"
# MICD: kompresi LZ4 untuk blob AST/verify (Kritik 15 db.md)
lz4_flex = { version = "0.11", default-features = false, features = ["frame"] }
wavefst = { version = "0.1", default-features = false, features = ["gzip"] }

# ── Fase 0: Foundation ──
dashmap = "6"
crossbeam = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
memmap2 = "0.9"

# ── Utility ──
num_cpus = "1"
walkdir = "2"
fxhash = "0.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Config file TOML (configs/*.toml — compiler/simulasi/coverage/debug)
toml = "0.8"

# ── Workspace crates (migrasi monorepo: src/ → crates/) ──
mivon-core = { path = "crates/mivon-core" }
mivon-diag = { path = "crates/mivon-diag" }
mivon-ast = { path = "crates/mivon-ast" }
mivon-ir = { path = "crates/mivon-ir" }
mivon-parser = { path = "crates/mivon-parser" }
mivon-elaboration = { path = "crates/mivon-elaboration" }
mivon-compiler = { path = "crates/mivon-compiler" }
mivon-simulator = { path = "crates/mivon-simulator" }
mivon-mv = { path = "crates/mivon-mv" }
mivon-sir = { path = "crates/mivon-sir" }
mivon-timing = { path = "crates/mivon-timing" }
mivon-tech = { path = "crates/mivon-tech" }
mivon-synth = { path = "crates/mivon-synth" }
mivon-env = { path = "crates/mivon-env" }
mivon-emu = { path = "crates/mivon-emu" }
mivon-tools = { path = "crates/mivon-tools" }
mivon-api = { path = "crates/mivon-api" }

# ── Opsional: JIT Compilation (cranelift) ──
cranelift = { version = "0.110", optional = true }
cranelift-jit = { version = "0.110", optional = true }
cranelift-frontend = { version = "0.110", optional = true }
cranelift-module = { version = "0.110", optional = true }

# ── Opsional: DPI-C FFI ──
libloading = { version = "0.8", optional = true }

# ── Opsional: LSP Server — tower-lsp/lsp-types kini di mivon-env ──
# tokio tetap di root: main.rs membuat Runtime untuk LSP (cfg feature lsp).
tokio = { version = "1", features = ["full"], optional = true }

# ── Opsional: Formal Verification (Z3 SMT) — z3 kini di mivon-formal ──

# ── Opsional: GUI native (egui) — eframe/egui/rfd kini di mivon-gui ──
# Backend rendering: wgpu (GPU/Vulkan) utama + glow (OpenGL) fallback.
# Crate mivon-gui mengelola deps GUI; root hanya wiring feature gui.

[features]
# Semua fitur diaktifkan secara default
# Untuk build minimal: cargo build --no-default-features
default = ["lsp", "jit", "formal", "dpi"]

# LSP server — re-export di mivon-api; tokio untuk Runtime di main.rs
lsp = ["mivon-api/lsp", "tokio"]

# Cranelift JIT — compiled-code simulation (expression + body level)
jit = ["cranelift", "cranelift-jit", "cranelift-frontend", "cranelift-module", "mivon-simulator/jit"]

# Formal verification (Z3 SMT solver + BMC engine) — di mivon-api
formal = ["mivon-api/formal"]

# DPI-C foreign language interface
dpi = ["libloading", "mivon-simulator/dpi", "mivon-env/dpi"]

# Native GUI (egui) — re-export di mivon-api; binary `mivon-gui` di crate mivon-gui
gui = ["mivon-api/gui"]

# Window display emulator (minifb framebuffer) — mivon emu --window
window = ["mivon-api/window"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Profil cepat untuk iterasi development — tanpa LTO agar link < 1 menit.
# Dipakai: `cargo build --profile fast`. Hasil benchmark FINAL tetap memakai
# `--release` (LTO) agar angka performance akurat.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

# Profil debug-gdb: kecepatan release + info Dwarf penuh (variabel lokal) agar
# `gdb` bisa membaca state guest (X86Cpu.ip/cs/gpr dll). Dipakai saat menyelidik
# fase boot: `cargo build --profile prof` lalu jalankan `./target/prof/mivon`.
[profile.prof]
inherits = "release"
debug = 2
lto = false
codegen-units = 16
